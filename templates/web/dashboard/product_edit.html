{% extends 'web/base.html' %}

{% block title %}Editar Producto — Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Editar Producto</h2>
    <a href="{% url 'web:dashboard_products' %}" class="btn btn-outline-secondary">← Volver a productos</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <form method="POST" action="{% url 'web:dashboard_product_edit' producto.id %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" value="{{ producto.nombre }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="3">{{ producto.descripcion }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio base</label>
                <input type="number" step="0.01" min="0" class="form-control" name="precio_base" value="{{ producto.precio_base }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select class="form-select" name="categoria" required>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}" {% if categoria.id == producto.categoria %}selected{% endif %}>
                            {{ categoria.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            {% if producto.imagen %}
                <div class="mb-3">
                    <label class="form-label">Imagen actual</label><br>
                    <img src="{{ producto.imagen }}" alt="{{ producto.nombre }}" style="max-width: 150px;" class="rounded">
                </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Cambiar imagen (opcional)</label>
                <input type="file" class="form-control" name="imagen" accept="image/*">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="activo" id="activo" {% if producto.activo %}checked{% endif %}>
                <label class="form-check-label" for="activo">Activo</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
        </form>
    </div>
</div>
{% endblock %}
