<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Commerce{% endblock %}</title>
    <!-- Bootstrap 5 para estilos básicos sin configuración extra -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar: visible en todas las páginas -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'web:catalog' %}">🛒 E-Commerce</a>

            <div class="navbar-nav ms-auto">
                {% if request.session.access_token %}
                    <!-- Usuario autenticado -->
                    <a class="nav-link" href="{% url 'web:cart' %}">🛒 Carrito</a>
                    <a class="nav-link" href="{% url 'web:orders' %}">📦 Mis Órdenes</a>
                    <a class="nav-link" href="{% url 'web:logout' %}">Cerrar sesión</a>
                {% else %}
                    <!-- Usuario no autenticado -->
                    <a class="nav-link" href="{% url 'web:login' %}">Iniciar sesión</a>
                    <a class="nav-link" href="{% url 'web:register' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Mensajes flash (errores, éxitos) -->
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    </div>

    <!-- Contenido principal: cada template hijo lo rellena -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>E-Commerce &copy; 2025</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
